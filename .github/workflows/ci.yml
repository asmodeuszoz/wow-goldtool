name: CI

# Single Cargo project at the repo root (docs/DECISIONS/0001-flat-cargo-layout-no-cli.md),
# so plain cargo steps are enough: no Tauri CLI, no Node toolchain, no display server.
#
# Every action name below is one GitHub resolves: `actions/checkout` and
# `dtolnay/rust-toolchain` (rustup-based, on the Actions marketplace). The system
# dependencies the Tauri shell needs on Linux are installed with apt directly, which
# keeps the workflow free of third-party setup actions. Which packages: measured off our
# OWN binary's NEEDED lines (`ldd target/debug/wow-goldtool`) - libwebkit2gtk-4.1.so.0,
# libgtk-3.so.0, libgobject-2.0.so.0, libsoup-3.0.so.0, libpango-1.0.so.0 - so the dev
# packages are gtk3 + webkit2gtk 4.1, NOT the gtk2 + webkit-4.0 pair the old file named.
#
# There is deliberately NO `cargo fmt --check` gate: measured on this tree,
# `cargo fmt --check` answers a diff (the house style is hand-written — long
# `use` lists, explicit `return`), so such a gate would be red for a style reason
# and not a bug. A rustfmt-clean tree would be its own deliberate milestone.
# The linter runs INFORMATIONAL: `cargo clippy` answers 0 errors and hundreds of
# warnings, so a `-D warnings` gate would lie about our own plan. The build's OWN
# named warning set rode FOUR through v0.11.0 (`PendingSql` privacy, unread `Tooltip`
# fields, `open_db`, `catalogue` - docs/DEVELOPMENT.md keeps that history, ADR 0011
# was the rule that made the set expected) and died entirely at v0.11.1, where ADR 0024
# fixed all four BY NAME rather than muting them - `cargo build` now answers nothing
# named. The gate stays off for clippy's own advice, never for our dead code.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          # each target rides the triple its image actually builds: macos-latest IS
          # arm64 - the toolchain step of the failing run answered host: aarch64-
          # apple-darwin, and the x86 mac std is not installed there.
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.platform.os }}
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the tree
        uses: actions/checkout@v7
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install the Ubuntu dev libraries our binary links against (gtk3 + webkit2gtk 4.1)
        if: matrix.platform.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build (dev)
        run: cargo build --target ${{ matrix.platform.target }}
      - name: Build (release)
        run: cargo build --release --target ${{ matrix.platform.target }}

  quality:
    runs-on: ubuntu-24.04
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the tree
        uses: actions/checkout@v7
      - name: Install the Rust toolchain (with the lint component)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install the Ubuntu dev libraries our binary links against (gtk3 + webkit2gtk 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Lint (informational — clippy's own advice; our named set died at v0.11.1, see docs/DEVELOPMENT.md)
        run: cargo clippy --all-targets

  test:
    runs-on: ubuntu-24.04
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the tree
        uses: actions/checkout@v7
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install the Ubuntu dev libraries our binary links against (gtk3 + webkit2gtk 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Unit + pipeline tests (fixture server, never the live API)
        run: cargo test
      # Active from v0.2.0 on: the headless CLI (docs/DECISIONS/0004) doubles as the
      # app's own integration test, run against the committed fixture server (which
      # speaks conditional GETs and forces one 429 per stage) so the suite never hammers
      # the upstream API. From v0.3.0 on the sequence also proves stop -> resume, a full
      # re-sync answered by 304s, and a live lookup served from the DB.
      # From v0.5.0 on the same sequence also proves the targeted detail stage (a watch
      # list, an id list, and the second pass over the same ids answered by 304s) and the
      # DB-only card read (`--cached`), which is what the item card shows before any
      # request goes out.
      # From v0.6.0 on the sequence also runs the THIRD stage, icons: the fixture answers
      # /icon/<name>.jpg with real image/jpeg bytes (embedded, so CI never asks a host for
      # pixels) and one record's icon FILE is gone (404, the stage's third state) - the
      # card read after it shows the local copy and the trend, and stats prints the ledger
      # count, which is what proves the one-sample-per-fresh-write rule end to end.
      # From v0.9.0 on the sequence also proves the LOCAL search door's scope (ADR
      # 0012): --where description reads the readable twin (tooltip_text/tooltip_lc,
      # v0.9.0's schema 4 -> 5 pair; CI's fresh file is BORN at 6 now, ADR 0016's hop)
      # and --where all is name OR description - the fixture grounds both:
      # item 25's COPIED tooltip says "One-Handed Sword" while its final NAME does
      # not - the fixture's OWN detail server assigns body["name"] = "Fixture Detail
      # <id>" to EVERY detailed row (measured in tests/fixture_api.py: the list door's
      # row named "Worn Shortsword" gets its name OVERWRITTEN at detail-write time,
      # and the only row keeping its list name is the checked-404 127555), so a name
      # scope "sword" would answer 0 and BOTH steps here answer 2 (row 25 + the
      # manual row's stated description): the copy makes the word findable where
      # names cannot. The all step also runs the OR clause's TWO-needle binding
      # whose marker count bind_sql checks. The manual row's card then shows the
      # row's card then shows the twin its stated fields earned at birth, DB-only.
      - name: CLI smoke test on a seeded fixture DB
        # the DB path is a plain RELATIVE path, not an expression: `runner.tmpDir` is
        # not a context property, measured on run #3 it evaluated to the empty string,
        # which made the first smoke step open `/fixture.sqlite` and answer 4 (docs/
        # DECISIONS/0011). The checkout root ignores *.sqlite, so the scratch DB can
        # neither miss a directory nor pollute a push.
        env:
          WGT_DB: fixture.sqlite
          WGT_LIMIT_BUDGET: '8'
        run: |
          python3 tests/fixture_api.py > /dev/null 2>&1 &
          sleep 1
          cargo run -- sync --stage list --fixture http://127.0.0.1:8765 --budget 1
          cargo run -- sync --stage list --fixture http://127.0.0.1:8765
          cargo run -- sync --stage list --fixture http://127.0.0.1:8765
          cargo run -- sync --stage detail --fixture http://127.0.0.1:8765
          cargo run -- item 25 --fixture http://127.0.0.1:8765
          cargo run -- watch add 25 40
          cargo run -- sync --stage detail --ids 25,40 --fixture http://127.0.0.1:8765
          cargo run -- sync --stage detail --ids 25,40 --fixture http://127.0.0.1:8765
          cargo run -- sync --stage detail --watch --fixture http://127.0.0.1:8765
          cargo run -- sync --stage icons --fixture http://127.0.0.1:8765
          # the fourth door of a pull (v0.8.0, ADR 0010): one tooltip copy per
          # record the detail stage answered, budgeted then drained - and the manual
          # layer's doors, which touch NO network at all (a bad ask answers 2, a
          # missing row answers 4), so a green mirror is also proof that a crawl and
          # a user's own edits cannot fight each other
          cargo run -- sync --stage tooltip --fixture http://127.0.0.1:8765 --budget 8
          cargo run -- sync --stage tooltip --fixture http://127.0.0.1:8765
          # the REFRESH stage (v0.9.6, ADR 0017): one live ask per record that ALREADY
          # holds a tooltip copy - the door is the TOOLTIP door, and the fixture now
          # answers its fields.price with the shape measured live 2026-11-21 (docs/API.md:
          # keys available,market,min,realms,region,scope,updated_at; the developers page
          # says tooltips cache ~5 min "because they carry a live Auction House price").
          # The fixture's grounds, named where they live (tests/fixture_api.py): rows 25
          # and 60 answer a min that MOVES with the fixture's RUN (14 000+/13 000+) while
          # their stored detail price is 15 000+ - so the replay can SEE price_min_now
          # differ from price_min on the SAME row instead of asserting they match; row 40
          # answers the WHOLE fields.price as literal null, the fixture twin of the
          # measured live id 200 third state, so the stage CHECKS it (price_now_missing_at,
          # value stays NULL, nothing invented); 12809 holds no tooltip copy (its tooltip
          # answered 404 above) and 127555 no detail stamp, so the queue never points at
          # either. Budgeted once then pressed again: the SECOND ask-count is zero - the
          # pending rule puts refreshed OR checked-empty rows out, one request per copied
          # record EVER - and both presses exit 0 with the third state COUNTED (missing 1
          # plus its note, fix(sync)'s counter, not just stamped).
          cargo run -- sync --stage price --fixture http://127.0.0.1:8765 --budget 4
          cargo run -- sync --stage price --fixture http://127.0.0.1:8765
          cargo run -- set-item 25 vendor_sell=606
          cargo run -- add-item "name=CI Test Mug" quality=Rare "tooltip_html=a plain CI sword mug"
          cargo run -- delete-item 60
          cargo run -- undelete-item 60
          # the local door's scope (v0.9.0, ADR 0012): the UPSTREAM search door was
          # measured names-only (docs/API.md: "tooltip" answers empty groups even
          # though the tooltip carries the word), so these two steps prove the LOCAL
          # door reads the readable twin - the fixture's copied tooltip of 25 says
          # "One-Handed Sword" while its NAME does not, and the manual row above
          # wears a stated description from birth. ZERO requests leave either door.
          cargo run -- search sword --where description
          cargo run -- search sword --where all
          # the live-search door: one ask, one request, against the fixture's
          # grouped answer - ungated because the door answers a 429 with exit 3
          cargo run -- live-search sword --fixture http://127.0.0.1:8765
          # and the same door with a two-word ask: the door percent-encodes the
          # space, the answer echoes it decoded (measured shape, docs/API.md)
          cargo run -- live-search "Worn Shortsword" --fixture http://127.0.0.1:8765
          # names-only trap: a tooltip-ish word answers EMPTY groups - still success
          cargo run -- live-search tooltip --fixture http://127.0.0.1:8765
          cargo run -- item 25 --cached
          # the manual row's card, DB-only: it shows the twin its fields earned at
          # birth - name, quality and the stated description - with ZERO requests
          cargo run -- item 900000000 --cached
          # the refresh door (v0.9.2, ADR 0013): the twin is DERIVED, so a DB whose
          # copies predate the corrected span rule gets them re-derived from the copy
          # it already holds - ZERO requests leave this door, so the fixture sees no
          # extra ask. The mirror's own twins were written by the corrected rule, so
          # the first press answers 0 rewritten / 4 unchanged; the v0.9.0 GLUED shape
          # (what 4 602 copies on the user's own file still are) is then PLANTED by
          # hand with python3's own sqlite3 - the same interpreter the fixture server
          # above already needs - and the phrase spanning an element boundary shows
          # the door's real gain: 0 hits before, refresh answers 1 rewritten, 1 hit
          # after, and a third press answers 0 again (idempotent, and still exit 0).
          cargo run -- refresh-twins
          python3 -c 'import sqlite3;s=sqlite3.connect("fixture.sqlite");s.execute("UPDATE item SET tooltip_text=?, tooltip_lc=? WHERE id=25",("Fixture Detail 25Item Level 1Main HandOne-Handed Sword1 - 3 DamageSpeed 1.9 Sell Price: 7c","fixture detail 25item level 1main handone-handed sword1 - 3 damagespeed 1.9 sell price: 7c"));s.commit()'
          cargo run -- search "damage speed" --where description
          cargo run -- refresh-twins
          cargo run -- search "damage speed" --where description
          cargo run -- refresh-twins
          # the icon doors (v0.9.3, ADR 0014): --icons puts the DB's OWN icon bytes
          # on a list answer, so what these two steps read is the mirror's icons stage
          # above - 3 files copied, 1 checked as gone upstream. Measured on a scratch
          # copy of this DB: WITHOUT the flag the trio answers as three nulls, WITH it
          # row 25's hit carries 2 596 chars of base64 plus icon_at, the manual row
          # carries none of the three ("no copy and never asked for one"), and the door
          # over every visible row shows the gone-stamped row 60 answering no bytes with
          # icon_missing_at set - the three states stay three answers. ZERO requests
          # leave either door (they only read the DB), so the fixture's GET tallies must
          # not move: a green replay keeps GETs at whatever the crawl made them, and
          # that unchanged tally IS the proof the flag asks nothing upstream. The payload
          # is not asserted byte-wise here; the replay record decodes it.
          cargo run -- search sword --where description --icons
          cargo run -- stats --icons
          cargo run -- stats
          # the live sort knob (v0.9.9, ADR 0020): --sort price-now orders rows by the
          # LIVE min buyout the price stage above wrote - rows 25/60 refreshed, row 40
          # checked price-less: its price_min_now stays NULL and sorts WITH the never-
          # refreshed tail (the stamps keep the two kinds of NULL apart; the order does
          # not care and does not guess). Measured on this mirror with BOTH binaries at
          # this very ask: v0.9.8 falls back to the default order (12809, 25, 40, 60 -
          # name wins the stored 18 106 tie), v0.9.9 answers the live order 60 BEFORE
          # 25 (live 16 106 vs 17 106). The plain-default doors above stay BYTE-IDENTICAL
          # old-vs-new (`search detail --where all --limit 8` md5 equal) - the knob rides
          # ONLY the new key. ZERO requests leave this step (search reads the DB), so the
          # fixture's GET tallies cannot move; money keeps its ADR 0015 rule (the price
          # COLUMN is the stored min, the ORDER reads the live column, and the UI note
          # says which is which beside every hit). Step count 33 -> 34 `cargo run --`,
          # plant line one.
          cargo run -- search detail --where all --sort price-now --limit 8
          # the SECOND source's stage + its local door (v0.10.0, ADR 0021): the recipe
          # set is NOT the API's - the API has no professions door (five probed paths
          # answer 404 today, docs/API.md + ADR 0021 measure them) and its recipe cards
          # name no job, no skill, no materials (0 of 716 copies say "Requires Materials");
          # the only MEASURED carrier of the materials is ReagentRoute's MIT dataset
          # (docs/API.md's second-source section carries the REAL counts: 8 classic files,
          # 1 240 entries, 2 843 484 bytes fetched today). CI never runs the real set -
          # the fixture serves TINY hand-built measured-shape rows (12 entries in 8 files)
          # whose ids are the fixture's OWN item rows, so every join state the door ships
          # is asserted HERE: a crafted id WITH a row (its DB-side name is the detail
          # stage's overwrite "Fixture Detail 25" - the set's own crafted_item_name rides
          # BESIDE it, never instead), a crafted id nobody ever priced (127555 detail-404ed
          # above -> money null + the UI's "no price", never 0c), a reagent id the DB never
          # saw (2589/5113 -> in_db false + "not in your DB" beside the set's words) and
          # the enchanting entries whose recipe names NO crafted item at all (the REAL set
          # carries exactly 133 such entries, docs/API.md records it). Pressed THREE times
          # the way every other stage is pressed: budgeted (3 files, 4 requests - the fixture
          # gates the stage's FIRST request, the retry path rides), then RESUMED at file 3
          # and COMPLETED (5 more files, 7 rows), then the RE-PULL answers EIGHT 304s and
          # writes NOTHING (the file ETags ride the meta table, the UPSERT keeps the 12 rows
          # the first two presses wrote - ADR 0003/0011's reuse discipline kept for the
          # second host). There is NO per-record third state IN the stage: a 404 FILE is
          # the source moving, and the stage ABORTS rc 3 (measured on a scratch audit
          # server, never committed here as a green step); the door-side third states are
          # READ facts the reader above names. The four door steps answer the 12 rows with
          # ZERO requests (the local-door rule ADR 0012 keeps for search and stats): `--limit
          # 40` echoes matching 12, `--profession Alchemy` binds the dataset's OWN word, the
          # Enchanting step carries `--icons` so the copied bytes ride beside the null-crafted
          # rows, and Cooking shows the 127555 join. The empty-table refusal (rc 4 BEFORE
          # this stage ran) is measured on a scratch DB, and the whole exit map re-runs
          # post-tag with the two new doors grown honestly. Step count 34 -> 41 step-lines,
          # plant line stays one.
          cargo run -- sync --stage recipes --fixture http://127.0.0.1:8765 --budget 3
          cargo run -- sync --stage recipes --fixture http://127.0.0.1:8765
          cargo run -- sync --stage recipes --fixture http://127.0.0.1:8765
          cargo run -- recipes --limit 40
          cargo run -- recipes --profession Alchemy --limit 3
          cargo run -- recipes --profession Enchanting --icons --limit 4
          cargo run -- recipes --profession Cooking --limit 3
          # v0.10.1 (ADR 0022): the paging doors ride ONE composition rule, and these
          # two steps are green BECAUSE it holds - they are the measured defect class
          # (`--offset` WITHOUT `--limit`): before the fix each answered rc 4 carrying
          # SQLite's raw `near "OFFSET": syntax error` refusal. Both doors are LOCAL
          # (ZERO requests, no new GET in the tally): over the fixture's 12 recipe rows
          # `recipes --offset 10` answers 2 rows of matching 12 and `search sword
          # --offset 4` answers the tail of the store's own sword rows (an EMPTY tail
          # is still rc 0 - the door's no-row-past-the-end shape, never a 4). Measured
          # on a fresh mirror BEFORE this block landed (driver generated from these
          # very steps): the pair rc 4 -> rc 0 against the v0.10.0 binary. Step count
          # 41 -> 43 step-lines, plant line stays one.
          cargo run -- recipes --offset 10
          cargo run -- search sword --offset 4
          # v0.11.0 (ADR 0023): the LIVE twin beside the STORED min, read IN the cell's
          # door. This step adds ZERO requests - the door is LOCAL and the live fields
          # come from the price stage's OWN press above (by-value joins): Blacksmithing
          # over the fixture's set answers 2 rows carrying BOTH live states side by
          # side - crafted 40 with `price_now_missing_at` SET ("looked, the AH offers
          # NOTHING right now", ADR 0017's third state, stamps keep it apart from
          # crafted 60's live pair DIFFERENT from the stored min with its own stamp).
          # The `--icons` press rides the DB's OWN copied bytes. `vendor_buy` /
          # `price_trend_normal` stay NULL in the answers: NO producer ever wrote them
          # (ADR 0016's rule - honest NULL, never filled here). Measured on a fresh
          # mirror BEFORE this block landed (driver generated from these very steps).
          # Step count 43 -> 44 step-lines, plant line stays one.
          cargo run -- recipes --profession Blacksmithing --icons --limit 3
          # money (v0.9.4, ADR 0015): this release adds NO step and NO request. Money
          # is DERIVED at answer time from the copper the doors above already carry
          # (schema stays 5, so there is nothing to refresh and nothing to migrate),
          # and it rides the answers these SAME steps read - the money of the two
          # search steps, of stats/stats --icons, of the crawl card and of the manual
          # card. Measured on a scratch copy of this fixture with BOTH the v0.9.3 and
          # the v0.9.4 binary over the same file: `item 25 --cached` 4 174 -> 4 336
          # bytes answers `price_min 20628` beside `2g 6s 28c` and the user-stated
          # `vendor_sell 606` beside `6s 6c`; the manual card 1 023 -> 1 103 answers
          # money `null` beside `null`; `stats` 1 467 -> 1 850, `stats --icons` 17 079
          # -> 17 462, `search sword --where description` 650 -> 763, `status` 1 035
          # -> 1 125. EVERY one of these keeps its own exit code (0 where it was 0,
          # 2/3/4 unchanged where the gated steps put them) - money is a value, never
          # a control path - and ADR 0011's rule holds: the step count stays 31, the
          # plant line stays one, and the fixture's GET tallies cannot move, because
          # money sends no ask. The money words come from the COLUMN, not from a copy:
          # the plant above gives row 25 a copy saying `Sell Price: 7c` while the CI's
          # own set-item left its column at 606, so money reads `6s 6c` - the same
          # single disagreement the user's own DB shows on item 25 (500 copper beside
          # `Sell Price: 7c`, 1 of 4 231). Upstream left it; recording it is the
          # honest answer, pasting the copy's words into a column is not.
          # price homes (v0.9.5, ADR 0016): this release adds NO step and NO request
          # again - the trio (vendor_buy / price_min_now / price_trend_normal) has NO
          # producer and NO reader yet, on user's instruction ("the columns should be
          # allocated now; how we'll get to those values can be ignored for now"). Measured
          # with BOTH the v0.9.4 binary (tree at 4875222) and this one over two copies of
          # the SAME fixture DB: 12 of the 13 doors BYTE-IDENTICAL - search --limit 6
          # 1 941 bytes, stats --limit 3 1 533, stats 1 850, stats --icons 17 462, item
          # 25 --cached 4 336, the made card 1 103, 12809/40 --cached 3 868 / 4 022,
          # the three --where search steps 763 / 755 / 3 363, refresh-twins 223 - and
          # `status` echoes its own db.path, so with that string pinned its JSON is
          # IDENTICAL too: the reservation moves ZERO bytes everywhere. The fresh smoke
          # DB is now BORN at schema 6 (the trio sits before raw_json in CREATE); the
          # 5 -> 6 ALTER chain does NOT run in CI - CI has no schema-5 file - and the
          # post-tag audit measures the migration on scratch copies instead (honest
          # split, ADR 0011's rule). Step count stays 31 `cargo run --`, plant line one,
          # and the GET tallies cannot move: the trio sends no ask. Note the paragraph
          # above speaks for v0.9.4, whose schema stay AT 5 was that release's claim;
          # v0.9.5 moved to 6, and money still writes nothing.
